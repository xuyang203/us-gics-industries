name: US GICS Industries

# 美股 GICS 行业隔夜行情：每个美股交易日收盘后抓取一次
#
# 时机说明（关键）：
#   美股收盘 = 美东 16:00
#     夏令时(3-11月) 16:00 EDT = 20:00 UTC = 北京次日 04:00
#     冬令时(11-3月) 16:00 EST = 21:00 UTC = 北京次日 05:00
#   cron 设在 UTC 22:00 = 北京次日 06:00，收盘后留 1-2 小时给盘后结算，
#   这样早上打开就能看到隔夜数据。
#   周一至周五(UTC) 执行 → 分别捕获美东周一至周五的收盘。
on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and aggregate
        run: node fetch_us_industries.js us-industries.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add us-industries.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(us-industries): update $(node -p "require('./us-industries.json').date")"
            git push
          fi
